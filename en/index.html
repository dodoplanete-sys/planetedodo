}

    let s = rd.result, done = 0, miss = [];
    R.forEach(([a, b]) => {
      const n = s.split(a).length - 1;
      if (n) { s = s.split(a).join(b); done++; } else miss.push(a.slice(0, 60));
    });
    const END = new RegExp('<\\/scr' + 'ipt>\\s*<\\/body>');
    s = s.replace(END, function () { return 'injectEthics();\n<' + '/script>\n<' + '/body>'; });
    if (page !== 'fr') {
      s = s.replace('<link rel="canonical" href="https://planetedodo.com/" />', '<link rel="canonical" href="https://planetedodo.com/' + page + '/" />');
      s = s.replace('<meta property="og:url" content="https://planetedodo.com/" />', '<meta property="og:url" content="https://planetedodo.com/' + page + '/" />');
    }
    const url = URL.createObjectURL(new Blob([s], {type: 'text/html'}));
    const name = file.name.replace(/\.html?$/i, '') + '_corrige.html';
    out.innerHTML = '<strong>' + done + ' de ' + R.length + ' correcciones aplicadas.</strong><br /><a href="' + url + '" download="' + name + '">Descargar ' + name + '</a>' +

  };
  rd.readAsText(file, 'utf-8');
});
