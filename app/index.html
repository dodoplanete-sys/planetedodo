<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planète Dodo</title>
<meta name="description" content="Journal de sommeil, tétées, couches et conseils pour les familles suivies par Planète Dodo.">
<meta name="theme-color" content="#1B2340">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  /* ---------- Fonts ---------- */
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Karla:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1B2340; --ink-soft:#4B4F72; --parchment:#FBF6EC; --parchment-dim:#F3ECDD;
    --card:#FFFFFF; --line:#E4DAC4;
    --moon:#C98A2E; --moon-glow:#F3D9A4;
    --lavender:#6B6FB0; --lavender-soft:#E7E7F5;
    --sage:#5C7A63; --sage-soft:#E4EDE3;
    --terracotta:#C15E36; --terracotta-soft:#F6E1D2;
    --teal:#3E7D77; --teal-soft:#E1EDEB;
    --danger:#B5473A;
    --shadow: 0 1px 2px rgba(27,35,64,.06), 0 8px 24px -12px rgba(27,35,64,.18);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#F1ECDD; --ink-soft:#B9BEDD; --parchment:#11142A; --parchment-dim:#171B36;
      --card:#1C2043; --line:#33375C;
      --moon:#F3D9A4; --moon-glow:#5A4A26;
      --lavender:#A9ACE6; --lavender-soft:#282C58;
      --sage:#9BC0A3; --sage-soft:#20302A;
      --terracotta:#E79A73; --terracotta-soft:#3A2620;
      --teal:#8FC9C1; --teal-soft:#1A2E2C;
      --danger:#E28A7D;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --ink:#F1ECDD; --ink-soft:#B9BEDD; --parchment:#11142A; --parchment-dim:#171B36;
    --card:#1C2043; --line:#33375C;
    --moon:#F3D9A4; --moon-glow:#5A4A26;
    --lavender:#A9ACE6; --lavender-soft:#282C58;
    --sage:#9BC0A3; --sage-soft:#20302A;
    --terracotta:#E79A73; --terracotta-soft:#3A2620;
    --teal:#8FC9C1; --teal-soft:#1A2E2C;
    --danger:#E28A7D;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  body{ margin:0; background:var(--parchment); color:var(--ink); font-family:'Karla', system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,.brand-word{ font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  a{ color:inherit; } button{ font-family:inherit; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 20px; }
  [hidden]{ display:none !important; }

  /* ---------- Header ---------- */
  header.top{
    position:relative; overflow:hidden;
    background:
      radial-gradient(1.5px 1.5px at 12% 30%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1.5px 1.5px at 24% 70%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1px 1px at 38% 20%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1.5px 1.5px at 55% 55%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1px 1px at 68% 15%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1.5px 1.5px at 82% 40%, var(--ink-soft) 60%, transparent 61%),
      radial-gradient(1px 1px at 91% 68%, var(--ink-soft) 60%, transparent 61%),
      linear-gradient(180deg, var(--parchment-dim), var(--parchment));
    border-bottom:1px solid var(--line); opacity:0.97;
  }
  header.top .inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:18px 20px 14px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-word{ font-size:1.4rem; font-weight:600; letter-spacing:.2px; }
  .brand-word em{ color:var(--moon); font-style:italic; }
  .tagline{ font-size:.82rem; color:var(--ink-soft); margin-top:2px; }
  .head-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }

  .lang-switch{ display:flex; gap:4px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow); }
  .lang-switch button{ border:none; background:transparent; color:var(--ink-soft); font-size:.76rem; font-weight:700; padding:6px 9px; border-radius:999px; cursor:pointer; letter-spacing:.03em; }
  .lang-switch button.active{ background:var(--ink); color:var(--parchment); }

  .account-chip{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:999px; padding:5px 6px 5px 12px; font-size:.76rem; color:var(--ink-soft); box-shadow:var(--shadow); }
  .account-chip button{ border:none; background:var(--parchment-dim); color:var(--ink); border-radius:999px; padding:5px 10px; font-weight:700; font-size:.74rem; cursor:pointer; }

  .status-banner{ font-size:.78rem; padding:9px 20px; text-align:center; border-bottom:1px solid var(--line); }
  .status-banner.local{ background:var(--moon-glow); color:var(--ink); }
  .status-banner.cloud{ background:var(--sage-soft); color:var(--sage); }

  .moonphase{ display:flex; align-items:center; gap:10px; padding:0 20px 16px; color:var(--ink-soft); font-size:.8rem; }
  .moon-disc{ position:relative; width:24px; height:24px; border-radius:50%; background:var(--moon-glow); flex:none; overflow:hidden; box-shadow:inset 0 0 0 1px var(--line); }
  .moon-disc .shadow{ position:absolute; top:0; bottom:0; background:var(--ink); opacity:.82; }

  /* ---------- Tabs ---------- */
  nav.tabs{ position:sticky; top:0; z-index:5; background:var(--parchment); border-bottom:1px solid var(--line); }
  nav.tabs .inner{ display:flex; gap:6px; overflow-x:auto; padding:10px 20px; }
  nav.tabs button{ flex:none; border:1px solid var(--line); background:var(--card); color:var(--ink-soft); font-weight:700; font-size:.8rem; padding:9px 13px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:7px; white-space:nowrap; }
  nav.tabs button svg{ width:15px; height:15px; }
  nav.tabs button.active{ background:var(--ink); color:var(--parchment); border-color:var(--ink); }

  main{ padding:26px 0 60px; }
  section.panel{ display:none; }
  section.panel.active{ display:block; animation:rise .3s ease both; }
  @media (prefers-reduced-motion: reduce){ section.panel.active{ animation:none; } }
  @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;} }

  .section-head{ margin-bottom:16px; display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:1.4rem; font-weight:600; }
  .section-head p{ color:var(--ink-soft); font-size:.9rem; max-width:60ch; line-height:1.5; margin-top:5px; }

  .card{ background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); }
  .pad{ padding:18px; }

  .stat-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:16px; }
  .stat-tile{ padding:15px; }
  .stat-tile .num{ font-size:1.5rem; font-weight:500; }
  .stat-tile .lbl{ font-size:.74rem; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; }
  .stat-tile.accent-lavender{ border-left:3px solid var(--lavender); }
  .stat-tile.accent-sage{ border-left:3px solid var(--sage); }
  .stat-tile.accent-gold{ border-left:3px solid var(--moon); }
  .stat-tile.accent-teal{ border-left:3px solid var(--teal); }

  .bio-card{ display:flex; gap:16px; align-items:flex-start; }
  .bio-card .avatar{ width:48px; height:48px; border-radius:50%; flex:none; background:linear-gradient(160deg, var(--moon-glow), var(--moon)); }
  .bio-card p{ line-height:1.6; font-size:.92rem; color:var(--ink-soft); margin:6px 0 0; }
  .bio-card .credentials{ margin-top:10px; font-size:.76rem; color:var(--ink-soft); border-top:1px dashed var(--line); padding-top:9px; }

  .quicklinks{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:16px; }
  .quicklink{ padding:15px; cursor:pointer; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:16px; }
  .quicklink svg{ width:19px; height:19px; margin-bottom:7px; }
  .quicklink b{ display:block; font-size:.9rem; } .quicklink span{ font-size:.76rem; color:var(--ink-soft); }
  .quicklink.c-lavender svg{ color:var(--lavender); } .quicklink.c-sage svg{ color:var(--sage); }
  .quicklink.c-terracotta svg{ color:var(--terracotta); } .quicklink.c-gold svg{ color:var(--moon); } .quicklink.c-teal svg{ color:var(--teal); }

  label{ font-size:.74rem; font-weight:700; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; display:block; margin-bottom:5px; }
  input, textarea, select{ width:100%; font-size:.9rem; padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--parchment-dim); color:var(--ink); font-family:inherit; }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--lavender); outline-offset:1px; }

  .btn{ border:none; border-radius:999px; padding:10px 17px; font-weight:700; font-size:.83rem; cursor:pointer; display:inline-flex; align-items:center; gap:8px; }
  .btn:focus-visible{ outline:2px solid var(--ink); outline-offset:2px; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-primary{ background:var(--ink); color:var(--parchment); }
  .btn-lavender{ background:var(--lavender); color:#fff; }
  .btn-sage{ background:var(--sage); color:#fff; }
  .btn-terracotta{ background:var(--terracotta); color:#fff; }
  .btn-teal{ background:var(--teal); color:#fff; }
  .btn-danger{ background:var(--danger); color:#fff; }
  .btn-ghost{ background:transparent; border:1px solid var(--line); color:var(--ink); }
  .btn svg{ width:15px; height:15px; }
  .btn-block{ width:100%; justify-content:center; }

  /* ---------- Child switcher ---------- */
  .child-bar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  .child-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .child-pill{ border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:.8rem; font-weight:700; cursor:pointer; }
  .child-pill.active{ background:var(--ink); color:var(--parchment); border-color:var(--ink); }
  .child-add-btn{ border:1px dashed var(--line); background:transparent; color:var(--ink-soft); border-radius:999px; padding:7px 13px; font-size:.8rem; font-weight:700; cursor:pointer; }

  /* ---------- Journal / timer ---------- */
  .journal-grid{ display:grid; grid-template-columns:1.05fr 1fr; gap:18px; align-items:start; }
  @media (max-width:780px){ .journal-grid{ grid-template-columns:1fr; } }
  .timer-card{ text-align:center; padding:22px 18px; }
  .orbit-wrap{ max-width:270px; margin:0 auto; }
  .orbit-wrap svg{ display:block; width:100%; height:auto; }
  .orbit-caption{ font-size:.78rem; color:var(--ink-soft); margin:8px 0 18px; line-height:1.5; }
  .orbit-caption b{ font-family:'IBM Plex Mono', monospace; color:var(--ink); }
  @keyframes orbitPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
  .orbit-now-dot{ animation:orbitPulse 2.4s ease-in-out infinite; transform-origin:center; transform-box:fill-box; }
  @media (prefers-reduced-motion: reduce){ .orbit-now-dot{ animation:none; } }
  .timer-buttons{ display:flex; gap:10px; margin-bottom:14px; }
  .timer-buttons .btn{ flex:1; }
  .timer-live{ background:var(--lavender-soft); border-radius:14px; padding:16px; margin-top:6px; }
  .timer-live .elapsed{ font-size:1.9rem; font-weight:600; }
  .timer-live .sub{ font-size:.78rem; color:var(--ink-soft); margin-top:2px; }
  .divider-or{ display:flex; align-items:center; gap:10px; color:var(--ink-soft); font-size:.74rem; margin:16px 0; text-transform:uppercase; letter-spacing:.06em; }
  .divider-or::before, .divider-or::after{ content:""; flex:1; height:1px; background:var(--line); }
  .form-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .type-toggle{ display:flex; gap:8px; margin-bottom:12px; }
  .type-toggle button{ flex:1; border:1px solid var(--line); background:var(--parchment-dim); color:var(--ink-soft); border-radius:9px; padding:9px; font-weight:700; font-size:.8rem; cursor:pointer; }
  .type-toggle button.active{ background:var(--lavender); color:#fff; border-color:var(--lavender); }

  .suggestion{ background:var(--moon-glow); border-radius:14px; padding:14px 16px; margin-top:14px; font-size:.85rem; color:var(--ink); }
  .suggestion b{ font-family:'IBM Plex Mono', monospace; }

  .chart-wrap{ margin-top:14px; }
  .log-list{ list-style:none; margin:0; padding:0; margin-top:12px; display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; }
  .log-item{ display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--parchment-dim); }
  .log-item .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .log-item .dot.night{ background:var(--lavender); } .log-item .dot.nap{ background:var(--moon); }
  .log-item .dot.breast_l, .log-item .dot.breast_r, .log-item .dot.bottle, .log-item .dot.solid{ background:var(--teal); }
  .log-item .dot.wet{ background:var(--teal); } .log-item .dot.dirty{ background:var(--terracotta); } .log-item .dot.mixed{ background:var(--danger); }
  .log-item .meta{ flex:1; min-width:0; } .log-item .meta .top{ font-size:.84rem; font-weight:700; }
  .log-item .meta .sub{ font-size:.75rem; color:var(--ink-soft); }
  .log-item .dur{ font-size:.88rem; font-weight:700; }
  .log-item .del{ background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:1rem; line-height:1; padding:4px; }
  .empty{ color:var(--ink-soft); font-size:.85rem; padding:14px 0; }

  /* ---------- Feeding / diaper quick add ---------- */
  .quick-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr)); gap:8px; }
  .quick-btn{ border:1px solid var(--line); background:var(--parchment-dim); border-radius:12px; padding:12px 8px; text-align:center; cursor:pointer; font-size:.8rem; font-weight:700; color:var(--ink); }
  .quick-btn svg{ width:18px; height:18px; display:block; margin:0 auto 6px; color:var(--teal); }
  .quick-btn.diaper svg{ color:var(--terracotta); }

  /* ---------- Age pills / tips ---------- */
  .age-pills{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
  .age-pills button{ border:1px solid var(--line); background:var(--card); color:var(--ink-soft); border-radius:999px; padding:8px 14px; font-size:.8rem; font-weight:700; cursor:pointer; }
  .age-pills button.active.sage{ background:var(--sage); color:#fff; border-color:var(--sage); }
  .age-pills button.active.terracotta{ background:var(--terracotta); color:#fff; border-color:var(--terracotta); }
  .age-pills button .tag{ font-size:.68rem; opacity:.75; margin-left:4px; }
  .tip-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .tip-list li{ display:flex; gap:12px; padding:14px 16px; border-radius:12px; align-items:flex-start; font-size:.9rem; line-height:1.5; }
  .tip-list li svg{ width:18px; height:18px; flex:none; margin-top:2px; }
  .panel-signals .tip-list li{ background:var(--sage-soft); } .panel-signals .tip-list li svg{ color:var(--sage); }
  .panel-nutrition .tip-list li{ background:var(--terracotta-soft); } .panel-nutrition .tip-list li svg{ color:var(--terracotta); }
  .disclaimer{ font-size:.75rem; color:var(--ink-soft); margin-top:14px; font-style:italic; }

  /* ---------- Questions ---------- */
  .send-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
  .q-list{ list-style:none; margin:16px 0 0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .q-item{ padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--parchment-dim); }
  .q-item .qtext{ font-size:.88rem; }
  .q-item .qmeta{ display:flex; justify-content:space-between; align-items:center; margin-top:6px; font-size:.71rem; color:var(--ink-soft); }
  .pill-sent{ background:var(--sage-soft); color:var(--sage); border-radius:999px; padding:2px 9px; font-weight:700; }

  /* ---------- Family / account panel ---------- */
  .invite-box{ display:flex; align-items:center; gap:10px; background:var(--parchment-dim); border-radius:12px; padding:12px 14px; margin-top:10px; }
  .invite-box .code{ font-size:1.1rem; font-weight:700; letter-spacing:.08em; }
  .member-note{ font-size:.78rem; color:var(--ink-soft); margin-top:8px; }

  /* ---------- Auth screen ---------- */
  .auth-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:30px 20px; }
  .auth-card{ width:100%; max-width:400px; padding:26px; }
  .auth-tabs{ display:flex; gap:6px; margin-bottom:18px; }
  .auth-tabs button{ flex:1; border:1px solid var(--line); background:var(--parchment-dim); color:var(--ink-soft); border-radius:9px; padding:9px; font-weight:700; font-size:.78rem; cursor:pointer; }
  .auth-tabs button.active{ background:var(--ink); color:var(--parchment); border-color:var(--ink); }
  .auth-field{ margin-bottom:12px; }
  .auth-error{ background:var(--terracotta-soft); color:var(--terracotta); font-size:.8rem; padding:9px 12px; border-radius:9px; margin-bottom:12px; }
  .auth-hint{ font-size:.76rem; color:var(--ink-soft); margin-top:10px; text-align:center; }

  footer{ border-top:1px solid var(--line); padding:20px 0 36px; color:var(--ink-soft); font-size:.75rem; text-align:center; line-height:1.7; }
  footer strong{ color:var(--ink); }
  ::-webkit-scrollbar{ height:8px; width:8px; } ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:8px; }
</style>
</head>
<body>

<!-- ============== AUTH SCREEN (shown only when Firebase is configured) ============== -->
<div class="auth-wrap" id="authScreen" hidden>
  <div class="card auth-card">
    <div class="brand" style="margin-bottom:18px;">
      <svg width="30" height="30" viewBox="0 0 34 34" fill="none" style="color:var(--moon)"><path d="M22 6a11 11 0 1 0 6 19.8A9 9 0 0 1 22 6Z" fill="currentColor"/></svg>
      <div><div class="brand-word">Plan<em>è</em>te Dodo</div></div>
    </div>
    <div class="auth-tabs">
      <button data-authtab="login" class="active" data-i18n="auth_login"></button>
      <button data-authtab="signup" data-i18n="auth_signup"></button>
      <button data-authtab="join" data-i18n="auth_join"></button>
    </div>
    <div class="auth-error" id="authError" hidden></div>

    <form id="formLogin">
      <div class="auth-field"><label data-i18n="auth_email"></label><input type="email" id="loginEmail" required autocomplete="email"></div>
      <div class="auth-field"><label data-i18n="auth_password"></label><input type="password" id="loginPassword" required autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_login_btn"></button>
    </form>

    <form id="formSignup" hidden>
      <div class="auth-field"><label data-i18n="auth_familyname"></label><input type="text" id="signupFamily" required></div>
      <div class="auth-field"><label data-i18n="auth_email"></label><input type="email" id="signupEmail" required autocomplete="email"></div>
      <div class="auth-field"><label data-i18n="auth_password"></label><input type="password" id="signupPassword" required minlength="6" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_signup_btn"></button>
    </form>

    <form id="formJoin" hidden>
      <div class="auth-field"><label data-i18n="auth_invitecode"></label><input type="text" id="joinCode" required style="text-transform:uppercase;"></div>
      <div class="auth-field"><label data-i18n="auth_email"></label><input type="email" id="joinEmail" required autocomplete="email"></div>
      <div class="auth-field"><label data-i18n="auth_password"></label><input type="password" id="joinPassword" required minlength="6" autocomplete="new-password"></div>
      <button type="submit" class="btn btn-primary btn-block" data-i18n="auth_join_btn"></button>
    </form>
  </div>
</div>

<!-- ============== MAIN APP ============== -->
<div id="appRoot">
<header class="top">
  <div class="inner wrap">
    <div class="brand">
      <svg width="32" height="32" viewBox="0 0 34 34" fill="none" style="color:var(--moon)">
        <path d="M22 6a11 11 0 1 0 6 19.8A9 9 0 0 1 22 6Z" fill="currentColor"/>
        <circle cx="27" cy="9" r="1.3" fill="currentColor"/><circle cx="8" cy="24" r="1" fill="currentColor"/><circle cx="6" cy="14" r="0.8" fill="currentColor"/>
      </svg>
      <div>
        <div class="brand-word">Plan<em>è</em>te Dodo</div>
        <div class="tagline" data-i18n="tagline"></div>
      </div>
    </div>
    <div class="head-right">
      <div class="account-chip" id="accountChip" hidden>
        <span id="accountEmail"></span>
        <button id="btnLogout" data-i18n="auth_logout"></button>

  function bandFromBirth(birth){

  }

  /* ================= SUGGESTION ================= */
  function wakeWindowMinutes(months){
    if(months == null) return null;
    if(months < 3) return 60; if(months < 6) return 105; if(months < 9) return 150;
    if(months < 12) return 195; if(months < 18) return 240; if(months < 24) return 300;
    if(months < 36) return 360; return null;
  }
  function nextSuggestedSleep(){
    var c = currentChild();
    var months = c ? ageInMonths(c.birth) : null;
    var ww = wakeWindowMinutes(months);
    var lastSleep = state.logs.filter(function(l){ return l.category==="sleep" && l.end; })
      .sort(function(a,b){ return (b.date+b.end) < (a.date+a.end) ? -1 : 1; })[0];
    if(!ww || !lastSleep) return null;
    var endDate = new Date(lastSleep.date + "T" + lastSleep.end + ":00");
    return new Date(endDate.getTime() + ww*60000);
  }
  function renderSuggestion(){
    var cap = document.getElementById("orbitCaption");
    var next = nextSuggestedSleep();
    if(!next){ cap.textContent = t("suggestion_none"); }
    else { cap.innerHTML = t("suggestion_text").replace("{time}", fmtTime(next)); }
  }

  /* ================= DAY ORBIT (circular sleep-cycle visualization) =================
     A 24h dial: noon at the top, midnight at the bottom, 6:00 on the left and
     18:00 on the right (like a day/night sky arc). Each sleep log becomes an
     arc positioned by its real clock time; the center shows either the running
     timer's elapsed time or a live countdown to the next suggested nap. */
  function polar(cx, cy, r, angleDeg){
    var rad = angleDeg * Math.PI / 180;
    return { x: cx + r*Math.sin(rad), y: cy - r*Math.cos(rad) };
  }
  function angleForHour(hourFloat){ return (hourFloat - 12) * 15; }
  function hourFloatFromHHMM(str){
    var p = String(str||"0:0").split(":");
    return (parseInt(p[0],10)||0) + (parseInt(p[1],10)||0)/60;
  }
  function describeArc(cx, cy, r, startAngle, endAngle){
    var s = polar(cx, cy, r, startAngle);
    var e = polar(cx, cy, r, endAngle);
    var sweep = endAngle - startAngle;
    var largeArc = Math.abs(sweep) > 180 ? 1 : 0;
    var sweepFlag = sweep >= 0 ? 1 : 0;
    return "M "+s.x.toFixed(2)+" "+s.y.toFixed(2)+" A "+r+" "+r+" 0 "+largeArc+" "+sweepFlag+" "+e.x.toFixed(2)+" "+e.y.toFixed(2);
  }
  var orbitTickStarted = false;
  function renderOrbit(){
    var svg = document.getElementById("orbitSvg");
    if(!svg) return;
    var cx=150, cy=150, rTrack=118, rArc=98, rTick=132;
    var parts = [];
    // guide circle
    parts.push('<circle cx="'+cx+'" cy="'+cy+'" r="'+rTrack+'" fill="none" stroke="var(--line)" stroke-width="1.5" stroke-dasharray="1 7" stroke-linecap="round"/>');
    // hour ticks + labels at 00/06/12/18
    [0,6,12,18].forEach(function(h){
      var a = angleForHour(h);
      var p1 = polar(cx,cy,rTrack-6,a), p2 = polar(cx,cy,rTrack+6,a), pl = polar(cx,cy,rTick,a);
      parts.push('<line x1="'+p1.x+'" y1="'+p1.y+'" x2="'+p2.x+'" y2="'+p2.y+'" stroke="var(--ink-soft)" stroke-width="1.5" opacity="0.5"/>');
      parts.push('<text x="'+pl.x+'" y="'+(pl.y+3)+'" font-size="9" text-anchor="middle" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace" opacity="0.7">'+pad2(h)+'</text>');
    });
    // sun (noon, top) / moon (midnight, bottom) landmarks
    var sunP = polar(cx,cy,rTrack,0), moonP = polar(cx,cy,rTrack,180);
    parts.push('<circle cx="'+sunP.x+'" cy="'+(sunP.y-16)+'" r="5" fill="var(--moon)" opacity="0.8"/>');
    parts.push('<circle cx="'+moonP.x+'" cy="'+(moonP.y+16)+'" r="4" fill="var(--lavender)" opacity="0.7"/>');

    // today + yesterday sleep logs only, drawn as arcs on the dial (older history stays in the list below, not on the dial)
    var yesterdayStr = new Date(Date.now()-86400000).toISOString().slice(0,10);
    var recent = state.logs.filter(function(l){
      return l.category==="sleep" && l.start && l.mins && (l.date===today || l.date===yesterdayStr);
    });
    recent.forEach(function(l){
      var startHour = hourFloatFromHHMM(l.start);
      var a0 = angleForHour(startHour);
      var a1 = a0 + (l.mins/60)*15;
      var color = l.kind === "night" ? "var(--lavender)" : "var(--moon)";
      parts.push('<path d="'+describeArc(cx,cy,rArc,a0,a1)+'" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" opacity="0.85"/>');
    });
    // in-progress timer arc (dashed)
    if(state.activeTimer){
      var sh = new Date(state.activeTimer.startedAt);
      var startHour2 = sh.getHours() + sh.getMinutes()/60;
      var elapsedMin = (Date.now() - state.activeTimer.startedAt)/60000;
      var a0b = angleForHour(startHour2);
      var a1b = a0b + Math.max(elapsedMin,4)/60*15;
      var color2 = state.activeTimer.kind === "night" ? "var(--lavender)" : "var(--moon)";
      parts.push('<path d="'+describeArc(cx,cy,rArc,a0b,a1b)+'" fill="none" stroke="'+color2+'" stroke-width="12" stroke-linecap="round" stroke-dasharray="3 5" opacity="0.95"/>');
    }
    // "now" marker
    var now = new Date();
    var nowHour = now.getHours() + now.getMinutes()/60;
    var nowP = polar(cx,cy,rTrack,angleForHour(nowHour));
    parts.push('<circle class="orbit-now-dot" cx="'+nowP.x+'" cy="'+nowP.y+'" r="4.5" fill="var(--ink)"/>');

    // center text
    var line1, line2, line3, line2Size = 30;
    if(state.activeTimer){
      var mins = Math.max(0, Math.floor((Date.now()-state.activeTimer.startedAt)/60000));
      line1 = t("orbit_running").replace("{type}", state.activeTimer.kind==="night" ? t("type_night") : t("type_nap"));
      line2 = pad2(Math.floor(mins/60))+":"+pad2(mins%60);
      line3 = t("orbit_since").replace("{time}", fmtTime(new Date(state.activeTimer.startedAt)));
    } else {
      var next = nextSuggestedSleep();
      if(next){
        var diffMin = Math.round((next - Date.now())/60000);
        line1 = t("orbit_next_label");
        if(diffMin <= 0){ line2 = t("orbit_overdue"); line2Size = 16; }
        else { line2 = diffMin >= 60 ? Math.floor(diffMin/60)+t("unit_h")+" "+pad2(diffMin%60) : diffMin+" min"; }
        line3 = t("orbit_towards").replace("{time}", fmtTime(next));
      } else {
        line1 = t("orbit_now_label");
        line2 = fmtTime(now);
        line3 = t("orbit_no_data");
      }
    }
    parts.push('<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" font-size="12" fill="var(--ink-soft)" font-family="Karla, sans-serif" font-weight="700">'+escapeHtml(line1)+'</text>');
    parts.push('<text x="'+cx+'" y="'+(cy+16)+'" text-anchor="middle" font-size="'+line2Size+'" fill="var(--ink)" font-family="Fraunces, serif" font-weight="600">'+escapeHtml(line2)+'</text>');
    parts.push('<text x="'+cx+'" y="'+(cy+38)+'" text-anchor="middle" font-size="11" fill="var(--ink-soft)" font-family="Karla, sans-serif">'+escapeHtml(line3)+'</text>');

    svg.setAttribute("viewBox","0 0 300 300");
    svg.innerHTML = parts.join("");

    if(!orbitTickStarted){
      orbitTickStarted = true;
      setInterval(renderOrbit, 20000);
    }
  }

  function last7Days(){ var days=[]; for(var i=6;i>=0;i--){ var d=new Date(); d.setDate(d.getDate()-i); days.push(d.toISOString().slice(0,10)); } return days; }

  function renderChart(){
    var days = last7Days();
    var sleepLogs = state.logs.filter(function(l){ return l.category==="sleep"; });
    var totals = days.map(function(day){ return sleepLogs.filter(function(l){ return l.date===day; }).reduce(function(a,l){ return a+l.mins; },0) / 60; });
    var max = Math.max(8, Math.ceil(Math.max.apply(null, totals)));
    var svg = document.getElementById("chartSvg");
    var W=280,H=130,padL=22,padB=18,padT=8,barGap=8;
    var innerW = W-padL-8, innerH = H-padB-padT;
    var barW = (innerW - barGap*(days.length-1))/days.length;
    var parts = [];
    parts.push('<line x1="'+padL+'" y1="'+padT+'" x2="'+padL+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>');
    parts.push('<line x1="'+padL+'" y1="'+(H-padB)+'" x2="'+W+'" y2="'+(H-padB)+'" stroke="var(--line)" stroke-width="1"/>');
    days.forEach(function(day, i){
      var val = totals[i]; var h = innerH * (val/max); var x = padL + 6 + i*(barW+barGap); var y = H - padB - h;
      parts.push('<rect x="'+x+'" y="'+y+'" width="'+barW+'" height="'+Math.max(h,1)+'" rx="3" fill="var(--lavender)"/>');
      var lbl = new Date(day+"T00:00:00").toLocaleDateString(state.lang, {weekday:"narrow"});
      parts.push('<text x="'+(x+barW/2)+'" y="'+(H-4)+'" font-size="8" text-anchor="middle" fill="var(--ink-soft)" font-family="Karla, sans-serif">'+lbl+'</text>');
    });
    parts.push('<text x="2" y="'+(padT+6)+'" font-size="8" fill="var(--ink-soft)" font-family="IBM Plex Mono, monospace">'+max+t("unit_h")+'</text>');
    svg.innerHTML = parts.join("");
  }

      addDoc(collection(dbFs, "families", state.cloud.familyId, "questions"), { text:text.trim(), at: Date.now(), from: state.cloud.user.email });
    } else {
      state.questions.unshift({ text:text.trim(), at:Date.now() }); state.questions = state.questions.slice(0,100);
      saveLS(LS.questions, state.questions); renderQuestions();
    }
  }
  function openWhats(text){ window.open("https://wa.me/"+CONTACT.whatsapp+"?text="+encodeURIComponent(text), "_blank", "noopener"); }
  function openMail(subject, text){ window.location.href = "mailto:"+CONTACT.email+"?subject="+encodeURIComponent(subject)+"&body="+encodeURIComponent(text); }
  document.getElementById("sendWhats").addEventListener("click", function(){
    var txt = document.getElementById("qText").value; if(!txt.trim()) return;
    var name = state.profile.parent ? " ("+state.profile.parent+")" : "";
    openWhats(txt+name); recordQuestion(txt); document.getElementById("qText").value = "";
  });
  document.getElementById("sendMail").addEventListener("click", function(){
    var txt = document.getElementById("qText").value; if(!txt.trim()) return;
    var name = state.profile.parent ? state.profile.parent : "";
    openMail("Question – Planète Dodo"+(name?" ("+name+")":""), txt); recordQuestion(txt); document.getElementById("qText").value = "";
  });

  /* ---------------- moon phase (approximate) ---------------- */
  function renderMoon(){
    var synodic = 29.53058867; var known = Date.UTC(2000,0,6,18,14);
    var days = (Date.now() - known) / 86400000; var phase = (days % synodic + synodic) % synodic; var frac = phase / synodic;
    var illum = (1 - Math.cos(frac*2*Math.PI)) / 2; var waxing = frac < 0.5;
    var shadowW = 24 * (1 - illum);
    var el = document.getElementById("moonShadow");
    el.style.width = shadowW + "px"; el.style.left = waxing ? "0" : (24 - shadowW) + "px";
    var key;
    if(frac < 0.03 || frac > 0.97) key="moon_new"; else if(frac < 0.22) key="moon_wax_cres"; else if(frac < 0.28) key="moon_first";
    else if(frac < 0.47) key="moon_wax_gib"; else if(frac < 0.53) key="moon_full"; else if(frac < 0.72) key="moon_wan_gib";
    else if(frac < 0.78) key="moon_last"; else key="moon_wan_cres";
    document.getElementById("moonLabel").textContent = t("moon_label")+" "+t(key);
  }

  /* ================= AUTH (cloud mode only) ================= */
  function showAuthTab(tab){
    document.querySelectorAll(".auth-tabs button").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-authtab")===tab); });
    document.getElementById("formLogin").hidden = tab !== "login";
    document.getElementById("formSignup").hidden = tab !== "signup";
    document.getElementById("formJoin").hidden = tab !== "join";
    document.getElementById("authError").hidden = true;
  }
  function authErr(msg){ var e = document.getElementById("authError"); e.textContent = msg || t("auth_error_generic"); e.hidden = false; }

  function randomCode(){ var chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; var s=""; for(var i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)]; return s; }

  function bootstrapFamilyForNewUser(userCred, familyName){
    var uidv = userCred.user.uid;
    var famRef = doc(collection(dbFs, "families"));
    var code = randomCode();
    return setDoc(famRef, { name: familyName, ownerUid: uidv, members: [uidv], inviteCode: code, createdAt: serverTimestamp() })
      .then(function(){ return setDoc(doc(dbFs, "inviteCodes", code), { familyId: famRef.id }); })
      .then(function(){ return setDoc(doc(dbFs, "users", uidv), { familyId: famRef.id }); });
  }
  function joinFamilyWithCode(userCred, code){
    var uidv = userCred.user.uid;
    return getDoc(doc(dbFs, "inviteCodes", code.trim().toUpperCase())).then(function(snap){
      if(!snap.exists()) throw new Error("invalid-code");
      var familyId = snap.data().familyId;
      return updateDoc(doc(dbFs, "families", familyId), { members: arrayUnion(uidv) })
        .then(function(){ return setDoc(doc(dbFs, "users", uidv), { familyId: familyId }); });
    });
  }

  function wireCloudAuth(){
    setPersistence(auth, browserLocalPersistence).catch(function(){});

    document.querySelectorAll(".auth-tabs button").forEach(function(b){ b.addEventListener("click", function(){ showAuthTab(b.getAttribute("data-authtab")); }); });

    document.getElementById("formLogin").addEventListener("submit", function(e){
      e.preventDefault();
      signInWithEmailAndPassword(auth, document.getElementById("loginEmail").value, document.getElementById("loginPassword").value)
        .catch(function(err){ authErr(err.message); });
    });
    document.getElementById("formSignup").addEventListener("submit", function(e){
      e.preventDefault();
      var familyName = document.getElementById("signupFamily").value;
      createUserWithEmailAndPassword(auth, document.getElementById("signupEmail").value, document.getElementById("signupPassword").value)
        .then(function(cred){ return bootstrapFamilyForNewUser(cred, familyName); })
        .catch(function(err){ authErr(err.message); });
    });
    document.getElementById("formJoin").addEventListener("submit", function(e){
      e.preventDefault();
      var code = document.getElementById("joinCode").value;
      createUserWithEmailAndPassword(auth, document.getElementById("joinEmail").value, document.getElementById("joinPassword").value)
        .then(function(cred){ return joinFamilyWithCode(cred, code); })
        .catch(function(err){ authErr(err.message); });
    });
    document.getElementById("btnLogout").addEventListener("click", function(){ signOut(auth); });

    onAuthStateChanged(auth, function(user){
      unsubAllCloud();
      if(user){
        state.cloud.user = user;
        document.getElementById("authScreen").hidden = true;
        document.getElementById("appRoot").style.display = "";
        document.getElementById("accountChip").hidden = false;
        document.getElementById("accountEmail").textContent = user.email;
        document.getElementById("cloudFamilyBox").hidden = false;
        document.getElementById("localFamilyBox").hidden = true;
        getDoc(doc(dbFs, "users", user.uid)).then(function(snap){
          if(!snap.exists()){ authErr(); return; }
          state.cloud.familyId = snap.data().familyId;
          attachFamilyListeners();
        });
      } else {
        state.cloud.user = null; state.cloud.familyId = null;
        document.getElementById("authScreen").hidden = false;
        document.getElementById("appRoot").style.display = "none";
      }
    });
  }

  function startLocalMode(){
    document.getElementById("authScreen").hidden = true;
    document.getElementById("appRoot").style.display = "";
    loadLocalChildLogsIntoState();
    (function(){ var c = currentChild(); if(c){ var b = bandFromBirth(c.birth); state.signalsAge=b; state.nutritionAge=b; } })();
    renderI18n();
  }

  function startCloudMode(){
    document.getElementById("authScreen").hidden = false;
    document.getElementById("appRoot").style.display = "none";
    Promise.all([
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"),
      import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js")
    ]).then(function(mods){
      var appMod = mods[0], authMod = mods[1], fsMod = mods[2];
      initializeApp = appMod.initializeApp;
      getAuth = authMod.getAuth; onAuthStateChanged = authMod.onAuthStateChanged;
      createUserWithEmailAndPassword = authMod.createUserWithEmailAndPassword;
      signInWithEmailAndPassword = authMod.signInWithEmailAndPassword;
      signOut = authMod.signOut; setPersistence = authMod.setPersistence;
      browserLocalPersistence = authMod.browserLocalPersistence;
      getFirestore = fsMod.getFirestore; doc = fsMod.doc; getDoc = fsMod.getDoc; setDoc = fsMod.setDoc;
      updateDoc = fsMod.updateDoc; addDoc = fsMod.addDoc; deleteDoc = fsMod.deleteDoc;
      collection = fsMod.collection; query = fsMod.query; orderBy = fsMod.orderBy; limit = fsMod.limit;
      onSnapshot = fsMod.onSnapshot; arrayUnion = fsMod.arrayUnion; serverTimestamp = fsMod.serverTimestamp;

      fbApp = initializeApp(firebaseConfig);
      auth = getAuth(fbApp);
      dbFs = getFirestore(fbApp);
      wireCloudAuth();
      renderI18n();
    }).catch(function(err){
      console.warn("Planète Dodo: no se pudo cargar Firebase, sigo en modo local.", err);
      CLOUD_ENABLED = false;
      startLocalMode();
    });
  }

  if(CLOUD_ENABLED){ startCloudMode(); } else { startLocalMode(); }

  function unsubAllCloud(){ state.cloud.unsub.forEach(function(u){ u(); }); state.cloud.unsub = []; }

  function attachFamilyListeners(){
    var famId = state.cloud.familyId;
    state.cloud.unsub.push(onSnapshot(doc(dbFs, "families", famId), function(snap){
      if(!snap.exists()) return;
      document.getElementById("inviteCodeDisplay").textContent = snap.data().inviteCode || "------";
    }));
    state.cloud.unsub.push(onSnapshot(collection(dbFs, "families", famId, "children"), function(snap){
      state.children = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      if(!state.currentChildId || !state.children.find(function(c){ return c.id===state.currentChildId; })){
        state.currentChildId = state.children[0] ? state.children[0].id : null;
      }
      var c = currentChild();
      if(c){ var b = bandFromBirth(c.birth); state.signalsAge = b; state.nutritionAge = b; attachChildLogsListener(c.id); }
      renderI18n();
    }));
    state.cloud.unsub.push(onSnapshot(query(collection(dbFs, "families", famId, "questions"), orderBy("at","desc"), limit(50)), function(snap){
      state.questions = snap.docs.map(function(d){ return d.data(); });
      renderQuestions();
    }));
  }
  var childLogsUnsub = null;
  function attachChildLogsListener(childId){
    if(childLogsUnsub) childLogsUnsub();
    childLogsUnsub = onSnapshot(query(collection(dbFs, "families", state.cloud.familyId, "children", childId, "logs"), orderBy("date","desc"), limit(300)), function(snap){
      state.logs = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      renderJournal(); renderFeedDiaper();
    });
  }

  document.getElementById("btnCopyCode").addEventListener("click", function(){
    var code = document.getElementById("inviteCodeDisplay").textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(code);
  });

  if("serviceWorker" in navigator){
    window.addEventListener("load", function(){
      navigator.serviceWorker.register("sw.js").catch(function(){ /* offline install is a bonus, not required */ });
    });
  }
})();
</script>
